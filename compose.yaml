services:
  app:
    build:
      context: .
      target: base
    ports:
      - "${PERSONA_EVAC_PORT:-8010}:8000"
    environment:
      PERSONA_EVAC_OUTPUT: /app/output
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      PYTHONPATH: /app/src
    env_file: .env
    volumes:
      - ./:/app:ro
      - ./output:/app/output
  test:
    build:
      context: .
      target: test
  experiment:
    build:
      context: .
      target: base
    command: ["persona-evac", "run", "--config", "configs/experiments/mvp.json"]
    environment:
      PERSONA_EVAC_OUTPUT: /app/output
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file: .env
    volumes:
      - ./output:/app/output
  fetch-personas:
    build:
      context: .
      target: base
    command: ["persona-evac", "fetch-nemotron", "--output", "data/raw/nemotron_personas_10.jsonl", "--count", "10"]
    volumes:
      - ./data:/app/data
  openai-experiment:
    build:
      context: .
      target: base
    command: ["persona-evac", "run", "--config", "configs/experiments/mvp_openai.json"]
    environment:
      PERSONA_EVAC_OUTPUT: /app/output
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
  groq-experiment:
    build:
      context: .
      target: base
    command: ["persona-evac", "run", "--config", "configs/experiments/mvp_openai.json"]
    environment:
      PERSONA_EVAC_OUTPUT: /app/output
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
  fds:
    profiles: ["fds"]
    build:
      context: .
      target: fds
    volumes:
      - ./output/fds/t_junction:/work
    command: ["cp /input/t_junction.fds /work/t_junction.fds && /opt/fds/FDS-6.11.1_SMV-6.11.2_lnx/bin/intelmpi/bin/mpiexec -n 4 fds /work/t_junction.fds"]
  fds-gaehwasan:
    profiles: ["fds"]
    build:
      context: .
      target: fds
    volumes:
      - ./output/fds/gaehwasan:/work
      - ./configs/fds/gaehwasan.fds:/input/gaehwasan.fds:ro
    command: ["cp /input/gaehwasan.fds /work/gaehwasan.fds && /opt/fds/FDS-6.11.1_SMV-6.11.2_lnx/bin/intelmpi/bin/mpiexec -n 4 fds /work/gaehwasan.fds"]
  pyfds:
    profiles: ["pyfds"]
    build:
      context: .
      target: pyfds
    volumes:
      - ./output:/app/output
    command:
      - --scenario
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_scenario.json
      - --fds-dir
      - /app/output/fds/t_junction
      - --output-sqlite
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_trajectories.sqlite
      - --output-smoke-history
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_smoke_history.csv
      - --output-fed-history
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_fed_history.csv
      - --output-route-history
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_route_history.csv
      - --vis-cache
      - /app/output/t-junction-mvp-openai/seed-1/pyfds_vismap.npz
      - --cleanup
  pyfds-import:
    profiles: ["pyfds"]
    build:
      context: .
      target: base
    volumes:
      - ./output:/app/output
    command:
      - persona-evac
      - import-pyfds
      - --run-dir
      - /app/output/t-junction-mvp-openai/seed-1
      - --latest-dir
      - /app/output/latest
