[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona-evac"
version = "0.1.0"
description = "Reproducible persona-to-agent evacuation experiment MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "jupedsim==1.4.2",
  "shapely>=2.0,<3",
  "numpy>=1.26,<3",
  "fastapi>=0.116,<1",
  "python-dotenv>=1.1,<2",
  "pydantic>=2.11,<3",
  "pyarrow>=21,<22",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
persona-evac = "persona_evac.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_evac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["EXE002", "I001"]
