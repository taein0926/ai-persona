name: 시뮬레이션 Pages 자동 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: 데이터 검증 · 보안 검사 · 페이지 생성
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 소스 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 공개 내보내기 회귀 검사
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest tests/test_pages_export.py
      - name: JavaScript 구문 검사
        run: |
          node --check pages_replay.js
          node --check station_viewer.js
          node --check private_inspector.js
      - name: 고정된 계산 결과로 정적 페이지 생성
        run: python -m scripts.build_pages --from-runtime --output public --source-revision "$GITHUB_SHA"
      - name: 보안 검사 도구 다운로드 및 SHA-256 확인
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: 소스·압축 재생 자료 비밀정보 및 공개 파일 허용 목록 검사
        run: python -m scripts.check_pages_security --site public --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: 검사한 공개 폴더만 업로드
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    name: GitHub Pages 게시
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 검사를 통과한 페이지 게시
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
