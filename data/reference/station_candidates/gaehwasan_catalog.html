<script>
// 페이지 이동/검색 시 상단 로딩바 — "멈춘 건지 되는 건지" 바로 보이게(서버렌더라 새 페이지 뜨면 사라짐)
(function () {
  var bar = document.getElementById('loadbar');
  function go() { bar.classList.remove('done'); void bar.offsetWidth; bar.classList.add('on'); }
  // 폼 제출(검색 등)
  document.addEventListener('submit', function () { go(); }, true);
  // 내부 링크 클릭(새 탭·다운로드·앵커 제외)
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a || !a.href) return;
    if (a.target === '_blank' || a.hasAttribute('download')) return;
    if (a.getAttribute('href').charAt(0) === '#') return;
    if (a.protocol !== 'http:' && a.protocol !== 'https:') return;
    if (a.host !== location.host) return;
    if (a.closest('.star-btn')) return;
    go();
  }, true);
  // 뒤로가기 캐시로 복귀하면 바 리셋
  window.addEventListener('pageshow', function () { bar.classList.remove('on', 'done'); });
})();

// 관심 공고(★) 토글 — 세션 기반, 페이지 새로고침 없이
document.addEventListener('click', function (e) {
  const btn = e.target.closest('.star-btn');
  if (!btn) return;
  e.preventDefault();
  const token = document.querySelector('meta[name=csrf-token]').content;
  fetch(btn.dataset.url, {
    method: 'POST',
    headers: { 'X-CSRFToken': token, 'X-Requested-With': 'fetch' },
  }).then(r => r.json()).then(d => {
    btn.classList.toggle('on', d.starred);
    btn.setAttribute('aria-pressed', d.starred);
    btn.textContent = d.starred ? '★' : '☆';
  }).catch(() => {});
});
</script>
